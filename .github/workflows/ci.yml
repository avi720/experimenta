name: CI

# Pull requests are the gate for every branch, so `dev` is covered by its open `dev` -> `main` PR.
# Running on `push` to `dev` as well would run the same commit twice (a push run and a PR run).
# `main` still runs on push to check the merged result.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholders: unit tests and build only need defined env vars; no live network calls happen.
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-placeholder-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # .nvmrc is the single source of the Node version for CI and local development.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:run

      - name: Build
        run: npm run build

      # Only what ships to users: dev tooling advisories (vitest, eslint) do not reach production.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Ensure no Base44 references remain
        run: |
          # `git grep` exits 1 for "no match" and >1 for a real error. A plain `grep -r` over a
          # missing file (e.g. vite.config.js renamed to .ts) also exits non-zero, which the old
          # `if grep ...` read as "no match" and silently passed. A pathspec that matches nothing is
          # not an error for git grep, and `vite.config.*` follows a rename.
          status=0
          git grep -niI base44 -- src index.html 'vite.config.*' package.json package-lock.json || status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::Found Base44 references"
            exit 1
          elif [ "$status" -ne 1 ]; then
            echo "::error::Base44 check could not run (git grep exit code $status)"
            exit "$status"
          fi
